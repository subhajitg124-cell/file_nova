<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a room — FileNova v2</title>
  <meta name="description" content="Enter a 6-character FileNova room code to receive files, images, audio and text." />
  <meta name="theme-color" content="#0A0F1E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicons/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/animations.css" />
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a class="brand" href="/">FileNova <span class="badge">v2</span></a>
    </div>
    <h1>Join a room</h1>
    <p class="muted">Ask the sender for the 6-character code (or scan their QR).</p>
    <section class="card glass" aria-label="Join room">
      <form id="joinForm">
        <label for="codeInput">Room code</label>
        <input type="text" id="codeInput" maxlength="6" autocomplete="off" placeholder="AB12X9"
               style="font-size:28px;letter-spacing:6px;text-align:center" aria-label="6-character room code" />
        <p class="field-error" id="codeError" role="alert"></p>
        <label for="pinInput">PIN (only if the sender set one)</label>
        <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="4 digits, if any" />
        <button class="btn block" id="joinBtn" type="submit" style="margin-top:16px">Join room</button>
      </form>
    </section>
    <footer class="muted small"><a href="/">← Create your own room</a></footer>
  </main>
  <script src="/js/ui.js" defer></script>
  <script src="/js/join.js" defer></script>
</body>
</html>
